[package]
name = "dioxus-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
gloo-net = { version = "0.7.0", features = ["http"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
serde = { version = "1.0.229", features = ["derive"] }
